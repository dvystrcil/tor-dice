# Harbor pull credentials for the tor-dice namespace.
#
# InfisicalSecret CR per the homelab-secrets convention — NEVER
# commit literal stringData/data for credentials. The Infisical
# operator materializes this into a kubernetes.io/dockerconfigjson
# Secret named `tor-dice-harbor-pull` that the Deployment references
# via imagePullSecrets.
#
# Pattern copied verbatim from rpg-dice-mcp / mcp-server / mealie-mcp /
# open-terminal — same Infisical project + path + template shape. The
# only thing that changes per namespace is the secretName.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: tor-dice-harbor-pull
  namespace: tor-dice
  labels:
    app.kubernetes.io/name: tor-dice
    app.kubernetes.io/part-of: homelab-app
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator
      secretsScope:
        envSlug: prod
        projectSlug: homelab-bz-gt
        recursive: false
        secretsPath: /
  hostAPI: https://infisical.sirddail.net/api
  managedSecretReference:
    creationPolicy: Orphan
    secretName: tor-dice-harbor-pull
    secretNamespace: tor-dice
    secretType: kubernetes.io/dockerconfigjson
    template:
      data:
        .dockerconfigjson: '{"auths":{"{{ .HB_REGISTRY.Value }}":{"username":"{{ .HB_USERNAME.Value }}","password":"{{ .HB_PASSWORD.Value }}","auth":"{{ .HB_AUTH.Value }}"},"harbor-core.harbor.svc.cluster.local":{"username":"{{ .HB_USERNAME.Value }}","password":"{{ .HB_PASSWORD.Value }}","auth":"{{ .HB_AUTH.Value }}"}}}'
      includeAllSecrets: false
  resyncInterval: 60
