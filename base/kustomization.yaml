apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tor-dice
resources:
  - namespace.yaml
  - harbor-pull-secret.yaml
  - deployment.yaml
  - service.yaml
  - image-updater-rbac.yaml
images:
  - name: harbor.sirddail.net/ai/tor-dice
    # Bumped by argocd-image-updater on every new semver release (see
    # ../image-updater/tor-dice-image-updater.yaml). Initial value is
    # whatever the first GH release tag produces; ImageUpdater writes
    # back here so this file is the source of truth for the deployed
    # version.
    newTag: 0.0.1
